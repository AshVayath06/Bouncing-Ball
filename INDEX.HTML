<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball</title>
    <style>
        .ball{
            width: 100px;
            height: 100px;
            background-image:url(https://i.pinimg.com/736x/ee/58/bb/ee58bb04df68ef97b9484d3a181fd04e.jpg);
            background-size: cover;
            background-position:center;
            background-repeat: no-repeat;
            border-radius:50px;
            position:relative;
            margin: 50px auto;

            animation-name:bounce;
            animation-duration: 0.1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }

        @keyframes bounce{
            from{
                top:0px;
            }
            to{
                top:100px;
            }
        }

    </style>
</head>
<body>
    <div class="ball"></div>
    
    
</body>
</html>
